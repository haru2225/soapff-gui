[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soapff-gui"
version = "0.2.0"
description = "GUI for soapff: clay structure in, ClayFF force field with SOAP charges, LAMMPS run (here or over SSH), analysis"
requires-python = ">=3.9"
# soapff-cui (the force field writer) is bundled as the package soapff_cui; tkinter comes with Python
dependencies = ["numpy", "scipy", "ase", "dscribe", "matplotlib"]

[project.optional-dependencies]
sova = ["sovapy"]          # PDF / RDF of the analysis (or point soapff-gui to another Python that has SOVA)

[project.scripts]
soapff-gui = "soapff_gui.app:main"
soapff-cui = "soapff_cui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soapff_gui = ["data/*.npz"]
