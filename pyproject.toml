[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soapff-gui"
version = "0.1.0"
description = "GUI for soapff: clay structure in, LAMMPS run out, without touching the input files"
requires-python = ">=3.9"
dependencies = []   # soapff-cui: pip install it first (see README), or keep its checkout next to this folder / in $SOAPFF_HOME

[project.scripts]
soapff-gui = "soapff_gui.app:main"

[tool.setuptools.packages.find]
include = ["soapff_gui*"]

[tool.setuptools.package-data]
soapff_gui = ["data/*.npz"]
